name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 测试与一致性校验
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['18.x', '20.x', '22.x']

    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # 本项目零运行时依赖，无需 npm install

      - name: 校验 core/Presets.js 与 templates/*.json 同步
        run: npm run check:presets

      - name: 运行单元测试
        run: npm test

  pages:
    name: 部署到 GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      # enablement: true 会在仓库尚未启用 Pages 时自动开启，
      # 避免「工作流已就绪但设置里没开」导致的部署失败
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      # 项目本身就是纯静态站点，整个仓库直接发布
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v5
